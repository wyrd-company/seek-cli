$schema: https://refinery.systems/ontology/technical-design
title: seek secret resolution
relationships:
  related-to:
    - architecture
    - server
    - configuration
objective: >-
  Turn the layered client or server configuration into the provider keys and
  client tokens a command or the server uses, reading each secret from the one
  source its configuration names, so that the CLI and the server share one
  loader, one precedence rule and one Vault client, and so that inspecting a
  configuration never touches a secret.
design-challenges:
  ambient-vault-environment:
    >-
      A workspace often exports `BAO_ADDR` and `BAO_TOKEN` for its own
      OpenBao, while seek reads its token from another server. Those aliases
      sit in the environment layer, above the files, so they override the
      file's top-level `vault.address` and `vault.auth`, and an exported
      address can also move a secret whose own block names no address. Every
      `auth` mapping, top-level or a secret's own, is bound to the server in
      effect where it was declared, and a block uses a mapping only when its
      effective server matches, so no credential reaches a server it was not
      declared for. A secret whose Vault server differs from the exported one
      names `address` in its own `vault` block, which no top-level variable
      overrides, and the loader names both servers when it refuses a mapping.
  ambient-transport:
    >-
      Vault client libraries read `VAULT_*` variables themselves, including
      `VAULT_SKIP_VERIFY`, `VAULT_CACERT` and proxy settings, and Bun's
      `fetch` sends a request through the proxy that `HTTP_PROXY`,
      `HTTPS_PROXY`, `ALL_PROXY` or their lowercase forms select, and follows
      redirects, unless the request says otherwise. Any of these would carry
      a Vault token past the precedence and binding rules. seek's Vault client
      is its own HTTP client built from an effective `vault` block, and every
      request it sends sets the `fetch` options `proxy` (the block's `proxy`,
      or `false`) and `redirect: "error"`. On Bun 1.4.5, measured: a request
      without a `proxy` option went through `HTTP_PROXY`, `HTTPS_PROXY` and
      `ALL_PROXY`, and `proxy: ""` and `proxy: null` did not stop it;
      `proxy: false` connected directly with all three set while `tls.ca`
      still applied; and `redirect: "error"` rejected a 307 that the default
      followed.
  rotation-without-restart:
    >-
      Provider keys, client tokens and Vault tokens rotate while the server
      runs. The server resolves every secret again once
      `server.secret-refresh-seconds` has passed, a `file` source reads its
      file at each resolution, a token-file `auth` reads its file before each
      Vault read, and an AppRole login that Vault rejects with 403 is
      discarded and repeated once before the read is retried.
  outage-after-start:
    >-
      A server must keep serving when a source is briefly unavailable, and
      must not start on secrets it never read. The first resolution of each
      secret is required; a later one that fails writes one warning to stderr
      and keeps the value already held.
  inspection-without-secrets:
    >-
      `seek config show`, `seek config validate` and the missing-key
      suggestions must describe sources without running a helper, reading a
      secret file or contacting Vault. They work on the merged and bound
      configuration, in which each secret is still its source mapping; only
      resolution reads a secret.
  credentials-in-output:
    >-
      A Vault response, a helper's output and a helper's arguments can hold
      secrets, since nothing stops a user from passing a token as an argument.
      A failed Vault call cancels the response body unread and raises an
      error with only the method, path and status; a body that is not JSON
      names only the method and path. A helper appears in errors and in `seek
      config show` only as its program, the first element of its array, and
      its number of arguments, with its exit status when it failed, and never
      with its output.
proposed-design:
  high-level-overview:
    >-
      `loadConfiguration(kind, flags, env)` in `src/lib/config.ts` takes
      `client` or `server`, reads the files of that configuration, the
      environment and the parsed flags, validates each layer against the
      schema, merges them, binds every `vault` block to its `auth` mapping,
      validates the result, and returns the effective configuration with the
      layer of each value. Each command loads its configuration once, before
      its action runs. `resolveSecret(source)` in `src/lib/secrets.ts` reads
      one secret from its source mapping. The client resolves only what the
      command needs. `seek serve` builds a `SecretStore` that resolves every
      configured secret before it listens and caches each value with the time
      it was resolved.
  layers:
    >-
      Each layer is parsed into the schema's shape before validation. A file
      layer is the parsed YAML, with relative paths resolved against its
      directory. The environment layer is built from the variables whose
      names the schema derives and from the aliases its `x-env-aliases`
      annotations list, with each value converted to the setting's type: an
      integer, a number, a boolean (`true` or `false`), or a JSON array for a
      `command`. The flag layer comes from the Commander options generated
      from the same derivation. A setting a layer does not provide is absent
      from it, so an absent setting never replaces a lower layer's value. The
      merge walks the schema: mappings merge key by key, and a secret's
      source mapping, a Vault `auth` mapping and an array replace whole.
  vault-binding:
    >-
      While it merges the layers, the loader records for every `auth` mapping
      it meets, top-level or inside a secret's `vault` block, the layer that
      declared it and its bound server: the block's own `address` from that
      same layer, or else the normalized top-level address merged up to and
      including that layer, or none. After the merge, each `vault` block
      takes the merged top-level connection fields it lacks and computes its
      effective server. It then takes its own `auth` mapping if it declares
      one, and the merged top-level mapping otherwise, and keeps it only when
      the mapping's bound server equals its effective server. Any other case
      is a validation error that names the block's path, its effective server
      and the mapping's bound server or `unbound`, and it is reported with
      the other validation errors before any secret is resolved. A URL is
      normalized to its scheme, lowercase host, port and path without a
      trailing slash, and a `unix://` address to its canonical socket path.
  vault-reads:
    >-
      The Vault client reads one KV secret with `GET /v1/<mount>/data/<path>`
      for KV version 2 or `GET /v1/<mount>/<path>` for version 1, sending
      `X-Vault-Token` unless the mode is `none`, and `X-Vault-Namespace` when
      a namespace is set. AppRole logs in with `POST /v1/auth/<mount>/login`.
      A `unix://` address connects through the socket with the `unix` option
      of Bun's `fetch`; `ca-cert` is passed as its `tls.ca`, which replaces
      the default trust store for that request; and `proxy` and `redirect`
      are set as `ambient-transport` describes, so a 3xx answer to a read or
      a login is an error. Each call times out after 15 seconds. A read is
      shared, within one resolution and while in flight, only by secrets
      whose effective context is identical: server, namespace, mount, KV
      version, path, `ca-cert`, `proxy`, and the same bound `auth` mapping,
      identified by the layer and path that declared it.
