$schema: https://refinery.systems/ontology/technical-design
title: seek secret resolution
relationships:
  related-to:
    - architecture
    - server
    - configuration
objective: >-
  Turn the layered client or server configuration into the provider keys and
  client tokens a command or the server uses, reading each secret from the one
  source its configuration names, so that the CLI and the server share one
  loader, one precedence rule and one Vault client, and so that inspecting a
  configuration never touches a secret.
design-challenges:
  ambient-vault-environment:
    >-
      A workspace often exports `BAO_ADDR` and `BAO_TOKEN` for its own
      OpenBao, while seek reads its token from another server. Those aliases
      sit in the environment layer, above the files, so they override the
      file's top-level `vault.address` and `vault.auth`, and an exported
      address can also move a secret whose own block names no address. Every
      `auth` mapping, top-level or a secret's own, is bound to the server in
      effect where it was declared, and a block uses a mapping only when its
      effective server matches, so no credential reaches a server it was not
      declared for. A secret whose Vault server differs from the exported one
      names `address` in its own `vault` block, which no top-level variable
      overrides, and the loader names both servers when it refuses a mapping.
  ambient-transport:
    >-
      Vault client libraries read `VAULT_*` variables themselves, including
      `VAULT_SKIP_VERIFY`, `VAULT_CACERT` and proxy settings, and Bun's
      `fetch` picks a proxy from `HTTP_PROXY`, `HTTPS_PROXY` and `ALL_PROXY`,
      skips even an explicitly passed proxy for a host `NO_PROXY` matches,
      follows redirects, and trusts a store that `SSL_CERT_DIR` can change
      while the process runs. Any of these would carry a Vault token past the
      precedence and binding rules or make trust differ from what inspection
      shows. seek's Vault client therefore sends its requests with Bun's
      `node:http` and `node:https` modules: each request passes an explicit
      `ca` list, `rejectUnauthorized: true` and `agent: false`, keeps the
      default host check, and, with `vault.proxy`, runs TLS through a
      `CONNECT` tunnel that seek opens itself. Measured on Bun 1.4.5, with
      synthetic certificates and loopback proxies, and with `HTTP_PROXY`,
      `HTTPS_PROXY` and `ALL_PROXY` naming one proxy, `NO_PROXY=localhost` and
      `NODE_TLS_REJECT_UNAUTHORIZED=0`: `fetch` with `proxy` set to a second
      proxy, as a string or as `{ url }`, reached the Vault host directly and
      neither proxy saw a connection. The `node:https` client sent both a GET
      and a POST through one `CONNECT` to the second proxy, without
      `Proxy-Authorization`, while the ambient proxy saw nothing. It rejected
      an untrusted certificate, rejected a certificate that did not name the
      host, returned a 307 unfollowed, and trusted a private authority only
      when it was in the `ca` list.
  rotation-without-restart:
    >-
      Provider keys, client tokens and Vault tokens rotate while the server
      runs. The server resolves every secret again once
      `server.secret-refresh-seconds` has passed, a `file` source reads its
      file at each resolution, a token-file `auth` reads its file before each
      Vault read, and an AppRole login that Vault rejects with 403 is
      discarded and repeated once before the read is retried. Every resolved
      secret and credential has its surrounding whitespace removed, as seek
      0.3 did with `trim()` for its token and secret-ID files and its server
      secrets, so a file written for seek 0.3 with a trailing space or newline
      yields the same value.
  outage-after-start:
    >-
      A server must keep serving when a source is briefly unavailable, and
      must not start on secrets it never read. The first resolution of each
      secret is required; a later one that fails writes one warning to stderr
      and keeps the value already held.
  inspection-without-secrets:
    >-
      `seek config show`, `seek config validate` and the missing-key
      suggestions must describe sources without running a helper, reading a
      secret file or contacting Vault. They work on the merged and bound
      configuration, in which each secret is still its source mapping; only
      resolution reads a secret.
  credentials-in-output:
    >-
      A Vault response, a helper's output, a helper's arguments and a URL's
      user information can hold secrets, since nothing stops a user from
      passing a token as an argument or writing a password into a URL. A
      failed Vault call cancels the response body unread and raises an error
      with only the method, path and status; a body that is not JSON names
      only the method and path. A helper appears in errors and in `seek config
      show` only as its program, the first element of its array, and its
      number of arguments, with its exit status when it failed, and never with
      its output. Vault `address` and `proxy` values with a user name,
      password, query or fragment fail validation, and every URL printed in an
      error or by `seek config show`, including `server.url`, has those parts
      replaced by `<redacted>`. `configuration.show.schema.json` gives each
      kind of entry its own shape by path, so a raw value at a secret or
      `vault.auth` path, or an unredacted URL, is invalid output.
proposed-design:
  high-level-overview:
    >-
      `loadConfiguration({ kind, flags, env })` in `src/lib/config.ts` takes
      `client` or `server`, reads the files of that configuration, the
      environment and the parsed flags, validates each layer against the
      schema, merges them, binds every `vault` block to its `auth` mapping,
      validates the result, and returns the effective configuration with the
      layer of each value. Each command loads its configuration once, before
      its action runs. `SecretResolver` in `src/lib/secrets.ts` reads one
      secret from its source mapping. The client resolves only what the
      command needs. `seek serve` builds a `SecretStore` that resolves every
      configured secret before it listens and caches each value with the time
      it was resolved.
  layers:
    >-
      Each layer is parsed into the schema's shape before validation. A file
      layer is the parsed YAML, with relative paths resolved against its
      directory. The environment layer is built from the variables whose
      names the schema derives and from the aliases its `x-env-aliases`
      annotations list, with each value converted to the setting's type: an
      integer, a number, a boolean (`true` or `false`), or a JSON array for a
      `command`. The flag layer comes from the Commander options generated
      from the same derivation. A setting a layer does not provide is absent
      from it, so an absent setting never replaces a lower layer's value. The
      merge walks the schema: mappings merge key by key, and a secret's
      source mapping, a Vault `auth` mapping and an array replace whole.
  vault-binding:
    >-
      While it merges the layers, the loader records for every `auth` mapping
      it meets, top-level or inside a secret's `vault` block, the layer that
      declared it and its bound server: the block's own `address` from that
      same layer, or else the normalized top-level address merged up to and
      including that layer, or none. A mapping built from the `BAO_TOKEN` or
      `VAULT_TOKEN` alias is bound instead to `BAO_ADDR` or `VAULT_ADDR`
      respectively when that variable is set, because the environment layer
      selects its address and its token independently: with `BAO_ADDR` on one
      server, `VAULT_ADDR` on another and only `VAULT_TOKEN` set, the token
      stays bound to `VAULT_ADDR` while the layer's address is `BAO_ADDR`, and
      the block fails validation. After the merge, each `vault` block takes
      the merged top-level connection fields it lacks and computes its
      effective server. It then takes its own `auth` mapping if it declares
      one, and the merged top-level mapping otherwise, and keeps it only when
      the mapping's bound server equals its effective server. Any other case
      is a validation error that names the block's path, its effective server
      and the mapping's bound server or `unbound`, and it is reported with the
      other validation errors before any secret is resolved. A URL is
      normalized to its scheme, lowercase host, port and path without a
      trailing slash, and a `unix://` address to its canonical socket path.
  vault-reads:
    >-
      The Vault client reads one KV secret with the route
      `v1/<mount>/data/<path>` for KV version 2 or `v1/<mount>/<path>` for
      version 1, and AppRole logs in with `POST v1/auth/<mount>/login`. It
      builds each URL by appending `/` and the route to the normalized
      address, so a base path such as `/team-a` stays in front of every route,
      never by resolving an origin-relative `/v1/...` against the address,
      which drops the base path. Each mount and path loses its leading and
      trailing slashes, as in seek 0.3, and is split on `/` into segments that
      are percent-encoded one by one; an empty, `.` or `..` segment fails
      validation. Before it sends a request, with its token or secret ID, the
      client checks that the URL has the address's origin and starts with its
      base path. It sends `X-Vault-Token` unless the mode is `none`, and
      `X-Vault-Namespace` only when the effective namespace is nonempty, so
      `namespace: ""` sends no namespace header. A `unix://` address connects
      through the socket with the `socketPath` option of `node:http`. A 3xx
      answer is followed by the client itself, with the same token or login
      body, only for 301, 302, 303, 307 and 308 on a KV read and 307 and 308
      on a login, up to 20 times, and only when its `Location`, resolved
      against the request URL, passes the same origin and base-path check;
      otherwise the answer is an error naming the status and the refused
      origin and path, and nothing is sent there. seek 0.3, measured on Bun
      1.4.5 with synthetic credentials, followed a same-origin 307 for both
      operations, and also a 307 to another origin, sending `X-Vault-Token`
      and the AppRole login body to it; the `vault-redirects` decision refuses
      the second case. Each call times out after 15 seconds. A read is shared,
      within one resolution and while in flight, only by secrets whose
      effective context is identical: server, namespace, mount, KV version,
      path, certificate list, `proxy`, and the same bound `auth` mapping,
      identified by the layer and path that declared it.
  trust:
    >-
      When it loads the configuration, the loader builds each Vault block's
      certificate list. With `ca-cert` it is the certificates in that file.
      Without it, it is the set seek 0.3 trusted through Bun's default store
      (`us_get_default_ca_store` in Bun's `root_certs.cpp`), read from the
      same inputs: `tls.getCACertificates("bundled")`; the certificates in the
      file `NODE_EXTRA_CA_CERTS` names; the certificates in `SSL_CERT_FILE`,
      or else `/etc/ssl/cert.pem`, Bun's built-in path; the certificates in
      the files of `SSL_CERT_DIR`, or else `/etc/ssl/certs`, whose names are
      an OpenSSL subject hash such as `8d19b80a.0`, the only files OpenSSL's
      directory lookup opens; and `tls.getCACertificates("system")` when
      `NODE_USE_SYSTEM_CA=1`. The list does not change until the next load, so
      a certificate added to a directory while a server runs is trusted only
      after a restart, and `seek config show` reports each input it read with
      its path and certificate count. Measured on Bun 1.4.5:
      `tls.getCACertificates("default")` holds the bundled roots and
      `NODE_EXTRA_CA_CERTS` but not `SSL_CERT_FILE` or `SSL_CERT_DIR`, which
      is why the loader reads those itself. Each of `NODE_EXTRA_CA_CERTS`,
      `SSL_CERT_FILE` and `SSL_CERT_DIR` trusted the private test authority
      when supplied independently. A list built before the authority was
      added to `SSL_CERT_DIR` still rejected it, and one built after accepted
      it. The bundled roots alone trusted a public site. The operating
      system store behavior was checked against Bun's source.
