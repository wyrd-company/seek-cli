$schema: https://refinery.systems/ontology/decision-record
title: How a seek 0.3 configuration upgrades
relationships:
  related-to:
    - configuration
    - familiar-environment-names
    - authenticated-vault-proxy
    - vault-redirects
description: >-
  seek 0.3 reads a flat JSON file, `$XDG_CONFIG_HOME/seek/config.json` or
  `~/.config/seek/config.json`, whose keys are environment variable names, and
  reads its Vault and OpenBao settings from environment variables only:
  `SEEK_VAULT_PATH`, `SEEK_VAULT_ADDR`, `SEEK_VAULT_MOUNT`,
  `SEEK_VAULT_KV_VERSION`, `SEEK_VAULT_ROLE_ID`, `SEEK_VAULT_SECRET_ID`,
  `SEEK_VAULT_SECRET_ID_FILE`, `SEEK_VAULT_APPROLE_MOUNT`,
  `SEEK_VAULT_TOKEN_FILE` and `SEEK_VAULT_REFRESH_SECONDS`, with `VAULT_ADDR`
  and `BAO_ADDR` for the address, `VAULT_NAMESPACE` and `BAO_NAMESPACE` for
  the namespace, and `VAULT_TOKEN` and `BAO_TOKEN` for a token, each `VAULT_*`
  before its `BAO_*` twin. The server image reads the JSON file at
  `/config/seek/config.json`. At run time seek 0.3 takes each secret from the
  first place that holds a value that is not blank: for the server, and for
  the CLI's client token in server mode, the environment, then Vault, then the
  JSON file; for the CLI's provider keys, the environment, then the JSON file.
  The `configuration` specification replaces the JSON file with one YAML file
  per configuration and one source per secret, ranked by layer. Eight of the
  Vault variables have no place in it: `SEEK_VAULT_PATH`, `SEEK_VAULT_ADDR`,
  `SEEK_VAULT_ROLE_ID`, `SEEK_VAULT_SECRET_ID`, `SEEK_VAULT_SECRET_ID_FILE`,
  `SEEK_VAULT_APPROLE_MOUNT`, `SEEK_VAULT_TOKEN_FILE` and
  `SEEK_VAULT_REFRESH_SECONDS`. `SEEK_VAULT_MOUNT`, `SEEK_VAULT_KV_VERSION`
  and the `VAULT_*` and `BAO_*` aliases keep a place, with `BAO_*` first. This
  record decides what a release that implements the specification does with a
  setup that still uses the JSON file or the eight variables. Whether the
  provider key variables and `SEEK_SERVER_TOKEN` stay is
  `familiar-environment-names`. Under every option, `seek config path` prints
  the YAML file's path, `seek config init` writes YAML, `seek config show`
  prints a new format with `<redacted>` in place of a key's first and last
  four characters, and a file with an unknown key, such as an old flat key
  like `EXA_API_KEY`, stops a command with exit status 1.
considered-options:
  replace-and-migrate:
    description: >-
      The release reads only the specified files and names. A seek 0.3 file
      or one of the eight variables writes one warning that names its
      replacement, and `seek config migrate` writes the new file with the
      source seek 0.3 used for each secret, installing it only when the
      result selects the same sources, server and credentials in the current
      environment.
    positive:
      - One configuration loader and one precedence rule, with a guided,
        checked conversion.
    negative:
      - The warnings and the converter, which reproduces seek 0.3's selection
        rules, are built, tested and documented for a one-time move.
  read-0-3-for-one-release:
    description: >-
      The release also reads the JSON file and the eight variables, applying
      seek 0.3's own rules below the new files, with a warning on each run,
      and a later release removes them.
    positive:
      - No setup that uses the JSON file or the eight variables stops working
        on upgrade.
    negative:
      - Two loaders with different rules are built and tested, then removed
        in a second breaking release.
  replace-without-migration:
    description: >-
      The release reads only the specified files and names. The JSON file and
      the eight variables have no effect and produce no message, and each
      setup that used them is reconfigured by hand.
    positive:
      - One configuration loader, one precedence rule and no code or
        documents whose only purpose is the move from 0.3.
    negative:
      - A setup that used the JSON file or the eight variables gets none of
        those settings after the upgrade, and nothing says why until a
        command or the server reports the setting it lacks.
decision-outcome:
  chosen-option: replace-without-migration
  justification: >-
    The operator, Bob, ruled: "No - No, make this a breaking change. No
    migration, no warning." His reason: "We are still alpha 0x major, and I
    don't think anyone uses this except me." seek is at 0.3, before 1.0, and
    by the operator's assessment he is its only user, so a one-time manual
    change costs less than a converter, warnings or a second loader. The
    ruling is recorded on the epic's task 1 in workspace commits 39fd0d8 and
    c186e3b.
expected-outcomes:
  positive:
    - >-
      The configuration loader, the CLI and their documents describe one
      contract, with no 0.3 compatibility code to build, test or remove.
    - >-
      The application configuration standard's rule to warn on deprecated
      keys does not apply, because the 0.3 names are removed, not deprecated.
  negative:
    - >-
      A CLI that kept settings in the JSON file finds none after the upgrade.
      Its owner writes `~/.config/seek/client.yml`, or exports the derived
      variables, mapping each JSON key to its setting. `SEEK_SERVER_URL`
      becomes `server.url`, `SEEK_SERVER_TOKEN` becomes `server.token`, and
      each provider key becomes `providers.<upstream>.api-key`, where
      `GEMINI_API_KEY` maps to `providers.google` and the Brave keys to
      `providers.brave-search` and `providers.brave-answers`. Empty template
      entries are left out. The JSON file can then be deleted.
    - >-
      A server that kept settings in the JSON file, including the image with
      `/config/seek/config.json` mounted, starts without them. With no token
      it refuses to start; with a token it answers 503 for each provider whose
      key it lacks. Its owner writes `/etc/seek/server.yml` with the server's
      own mapping: each provider key becomes `providers.<upstream>.api-key` as
      for the client, and `SEEK_SERVER_TOKEN` becomes `server.tokens`.
      `SEEK_SERVER_URL` is left out, because it is a client setting that the
      seek 0.3 server ignored, and the server file has no `server.url`. The
      owner mounts the file at that path in the image, then checks it with
      `seek config validate --server` and `seek config show --server`.
    - >-
      A setup that read secrets through `SEEK_VAULT_PATH` gets none of them.
      Its owner gives each secret a `vault` source with the old path as `path`
      and the old variable name as `key`, so the KV secret in Vault or OpenBao
      keeps its fields. seek still removes leading and trailing slashes from a
      path or mount, as seek 0.3 did, so `SEEK_VAULT_PATH=/team/seek/` and
      `SEEK_VAULT_MOUNT=/secret/` carry over as written or as `team/seek` and
      `secret`; an empty segment inside one, such as `team//seek`, now fails
      validation. `SEEK_VAULT_ADDR` becomes `vault.address`;
      `SEEK_VAULT_ROLE_ID`, `SEEK_VAULT_SECRET_ID_FILE` and
      `SEEK_VAULT_APPROLE_MOUNT` become `vault.auth` with `mode: approle`,
      `role-id`, `secret-id: { file: ... }` and `mount`; a secret ID set in
      `SEEK_VAULT_SECRET_ID` moves into a file, or into
      `SEEK_VAULT_AUTH_SECRET_ID_VALUE` with `SEEK_VAULT_AUTH_MODE=approle`
      and `SEEK_VAULT_AUTH_ROLE_ID` set beside it; `SEEK_VAULT_TOKEN_FILE`
      becomes `vault.auth` with `mode: token` and `token: { file: ... }`; and
      `SEEK_VAULT_REFRESH_SECONDS` becomes the server's
      `server.secret-refresh-seconds`. seek 0.3 resolved a relative
      `SEEK_VAULT_TOKEN_FILE` or `SEEK_VAULT_SECRET_ID_FILE` against the
      service's working directory, while a relative path written into a file
      is relative to that file's directory: the owner resolves the old path
      against the service's old working directory, such as `/srv/seek` for
      `secrets/approle-id`, and writes the absolute result,
      `/srv/seek/secrets/approle-id`, or a path relative to the new file's
      directory that reaches it. Credential files can be reused as they are:
      seek removes surrounding whitespace from every secret, as seek 0.3 did
      for these files. A private certificate authority keeps working wherever
      seek 0.3 found it: in `NODE_EXTRA_CA_CERTS`, as the seek 0.3 server
      guide shows, in `SSL_CERT_FILE` or `SSL_CERT_DIR`, or in their built-in
      locations. seek reads them when the configuration loads, so a change
      takes effect at the next command or server restart, and `vault.ca-cert`
      replaces all of them for its server.
    - >-
      The retained Vault variables now rank differently. In seek 0.3 an
      explicit `SEEK_VAULT_ADDR`, AppRole or token file won over the `VAULT_*`
      and `BAO_*` address and token variables; now every environment variable,
      alias or derived, outranks the file, `BAO_*` outranks `VAULT_*`, and a
      derived `SEEK_VAULT_AUTH_*` outranks the token aliases. Where a `BAO_*`
      or `VAULT_*` set is exported for another server, the owner clears that
      whole set from seek's environment: its address, token and namespace
      together, because a token left without its address binds to the file's
      server and replaces the file's login. Or the owner gives each secret its
      own `vault` block with its `address`, its `auth`, and its `namespace`
      whenever the exported set carries one, `namespace: ""` when the secret's
      server uses the root namespace, because no exported variable overrides a
      block's own fields. Where `BAO_TOKEN` or `VAULT_TOKEN` is exported for
      the same server that the file's AppRole or token-file login uses, the
      token replaces that login; the owner unsets it for seek, sets the login
      with the derived `SEEK_VAULT_AUTH_*` variables, or puts `auth` on each
      secret's own `vault` block. A token alias is bound to its own family's
      address when that is set, so `VAULT_TOKEN` exported beside a different
      `BAO_ADDR` and `VAULT_ADDR` fails validation until the pair matches.
      `seek config show`, with `--server` for a server, confirms the result:
      each Vault source shows its address, its namespace, its `auth` mode and
      the layer that declared it.
    - >-
      seek 0.3 reached Vault through any proxy that `HTTP_PROXY`,
      `HTTPS_PROXY` or `ALL_PROXY` selected, and passed on a user name and
      password written in that proxy's address. A setup that needs a proxy
      sets `vault.proxy`, a host and port. A Vault reachable only through a
      proxy that needs a password can no longer be reached, as the operator
      decided in `authenticated-vault-proxy`; its owner gives seek a direct
      route to Vault or a proxy that needs no credentials.
    - >-
      Each secret has one source. A setup that relied on seek 0.3 falling back
      to the JSON value when a Vault field was absent or blank keeps the field
      set, or chooses the source it wants.
    - >-
      Scripts change. `seek config path` names the YAML file, and `seek config
      init` writes YAML. A script that writes the old flat keys, such as
      `EXA_API_KEY`, to that path gets exit status 1, naming the unknown key;
      JSON in the new shape is valid YAML and loads. A script that parses
      `seek config show` moves to `seek config show --json`, whose shape
      `configuration.show.schema.json` defines.
    - >-
      A seek 0.3 setup whose Vault answered with a redirect keeps working when
      the redirect stays within the address's origin and base path. One that
      relied on a redirect to another origin or outside the base path, such as
      a standby node redirecting to the active node, fails with an error
      naming the refused target until `vault.address` names the final address;
      that refusal is pending the operator's decision in `vault-redirects`.
