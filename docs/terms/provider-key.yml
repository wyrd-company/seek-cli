$schema: https://refinery.systems/ontology/term
title: Provider key
description: >-
  The API key for one upstream, the setting `providers.<upstream>.api-key`,
  such as `providers.exa.api-key`, whose environment variables are
  `SEEK_PROVIDERS_EXA_API_KEY_VALUE` and its siblings. In direct
  mode the CLI sends it to the provider; in server mode only the seek server
  holds it.
