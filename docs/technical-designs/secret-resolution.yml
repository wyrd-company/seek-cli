$schema: https://refinery.systems/ontology/technical-design
title: seek secret resolution
relationships:
  related-to:
    - architecture
    - server
    - configuration
objective: >-
  Turn the layered client or server configuration into the provider keys and
  client tokens a command or the server uses, reading each secret from the one
  source its configuration names, so that the CLI and the server share one
  loader, one precedence rule and one Vault client, and so that inspecting a
  configuration never touches a secret.
design-challenges:
  ambient-vault-environment:
    >-
      A workspace often exports `BAO_ADDR` and `BAO_TOKEN` for its own
      OpenBao, while seek reads its token from another server. Those aliases
      sit in the environment layer, above the files, so they override the
      file's top-level `vault.address` and `vault.auth`. Every `auth` mapping
      is bound to the server in effect where it was declared, and a block
      uses a mapping only when its effective server matches, so an exported
      token never reaches a server it was not declared for. A secret whose
      Vault server differs from the exported one names `address` in its own
      `vault` block, which no top-level variable overrides, and the loader
      names both servers when it drops an `auth` mapping.
  library-environment-reads:
    >-
      Vault client libraries read `VAULT_*` variables themselves, including
      `VAULT_SKIP_VERIFY`, `VAULT_CACERT` and proxy settings, which would
      bypass the precedence and binding rules. seek's Vault client is its own
      HTTP client built from an effective `vault` block: the address, the
      namespace header, the token and, when `ca-cert` is set, the certificate
      authorities it trusts. It reads no environment variable.
  rotation-without-restart:
    >-
      Provider keys, client tokens and Vault tokens rotate while the server
      runs. The server resolves every secret again once
      `server.secret-refresh-seconds` has passed, a `file` source reads its
      file at each resolution, a token-file `auth` reads its file before each
      Vault read, and an AppRole login that Vault rejects with 403 is
      discarded and repeated once before the read is retried.
  outage-after-start:
    >-
      A server must keep serving when a source is briefly unavailable, and
      must not start on secrets it never read. The first resolution of each
      secret is required; a later one that fails writes one warning to stderr
      and keeps the value already held.
  inspection-without-secrets:
    >-
      `seek config show`, `seek config validate` and the missing-key
      suggestions must describe sources without running a helper, reading a
      secret file or contacting Vault. They work on the merged configuration,
      in which each secret is still its source mapping; only resolution reads
      a secret.
  responses-stay-private:
    >-
      A Vault response and a helper's output can hold secrets. A failed Vault
      call cancels the response body unread and raises an error with only the
      method, path and status; a body that is not JSON names only the method
      and path; a failed helper reports its argument array and exit status,
      and never its output.
proposed-design:
  high-level-overview:
    >-
      `loadConfiguration(kind, flags, env)` in `src/lib/config.ts` takes
      `client` or `server`, reads the files of that configuration, the
      environment and the parsed flags, validates each layer against the
      schema, merges them, validates the result, and returns the effective
      configuration with the layer of each value. Each command loads its
      configuration once, before its action runs. `resolveSecret(source)` in
      `src/lib/secrets.ts` reads one secret from its source mapping. The
      client resolves only what the command needs. `seek serve` builds a
      `SecretStore` that resolves every configured secret before it listens
      and caches each value with the time it was resolved.
  layers:
    >-
      Each layer is parsed into the schema's shape before validation. A file
      layer is the parsed YAML, with relative paths resolved against its
      directory. The environment layer is built from the variables whose
      names the schema derives and from the aliases its `x-env-aliases`
      annotations list, with each value converted to the setting's type: an
      integer, a number, a boolean (`true` or `false`), or a JSON array for a
      `command`. The flag layer comes from the Commander options generated
      from the same derivation. A setting a layer does not provide is absent
      from it, so an absent setting never replaces a lower layer's value. The
      merge walks the schema: mappings merge key by key, and a secret's
      source mapping, a Vault `auth` mapping and an array replace whole.
  vault-binding:
    >-
      While it merges the layers, the loader records for each top-level `auth`
      mapping the normalized top-level address merged up to and including the
      layer that declared it, or none. After the merge, each `vault` block
      takes the merged top-level connection fields it lacks, then either keeps
      its own `auth` or takes the top-level mapping when that mapping's
      recorded server equals the block's effective server; otherwise
      validation reports the block's path and both servers. A URL is
      normalized to its scheme, lowercase host, port and path without a
      trailing slash, and a `unix://` address to its canonical socket path.
  vault-reads:
    >-
      The Vault client reads one KV secret with `GET /v1/<mount>/data/<path>`
      for KV version 2 or `GET /v1/<mount>/<path>` for version 1, sending
      `X-Vault-Token` unless the mode is `none`, and `X-Vault-Namespace` when
      a namespace is set. AppRole logs in with `POST
      /v1/auth/<mount>/login`. A `unix://` address connects through the socket
      with the `unix` option of Bun's `fetch`, and `ca-cert` is passed as its
      `tls.ca`, which replaces the default trust store for that request. Each
      call times out after 15 seconds. Secrets that name the same server,
      namespace, mount, path and KV version share one read per resolution, and
      concurrent resolutions share the read in flight.
  removed-settings:
    >-
      Before it loads a configuration, the loader checks for the seek 0.3
      file at `$XDG_CONFIG_HOME/seek/config.json` or
      `~/.config/seek/config.json` and for each variable in the schema's
      `x-removed-env`, and writes one warning for each it finds, naming the
      replacement and `seek config migrate`. `seek config migrate` reads the
      0.3 file as JSON and the removed variables, and, when `SEEK_VAULT_PATH`
      is set, the field names of that KV secret through the Vault client
      configured from the 0.3 variables. It builds the settings the
      `configuration` specification lists, validates them against the schema,
      and writes YAML with a comment naming the files and variables it read.
      It prints no secret value.
