$schema: https://refinery.systems/ontology/technical-design
title: seek secret resolution
relationships:
  related-to:
    - architecture
    - server
objective: >-
  Resolve every provider key and client token from the environment, a Vault or
  OpenBao KV secret, or the configuration file, with one precedence rule
  shared by the server and the client, so that a key can move between sources
  without any other change.
design-challenges:
  vault-unavailable-after-start:
    >-
      A long-running server must keep serving when Vault is briefly
      unreachable, yet must not start on secrets it never read. The Vault
      source treats its first read as required and every later read as a
      refresh: a failed refresh writes one warning to stderr and keeps the
      values it holds. The server reads the secret before it listens, so a
      failed first read stops it.
  rotating-credentials:
    >-
      Vault credentials and the secret itself rotate. A token file is read
      again before each secret read, so a token that Vault Agent rotates is
      picked up. An AppRole login token that Vault rejects with 403 is
      discarded, and the source logs in once more and retries the read. The
      cached secret is read again once the refresh interval has passed.
  client-without-vault-cost:
    >-
      A client that uses direct mode, or has `SEEK_SERVER_TOKEN` in its
      environment, must not contact Vault or fail on incomplete Vault
      settings. The client's resolver builds its Vault source only when it
      first needs the token from Vault, and only in server mode.
  responses-stay-private:
    >-
      A Vault response can hold secrets. A failed Vault call cancels the
      response body unread and raises an error with only the method, path and
      status, and a body that is not JSON raises an error that names only the
      method and path.
proposed-design:
  high-level-overview:
    >-
      `SecretResolver` in `src/server/secrets.ts` resolves a name from the
      process environment, then an optional Vault source, then the
      configuration file, and returns the first value that is not empty after
      trimming. The server builds one resolver with the Vault source that
      `vaultConfigFromEnv()` configures. The client's resolver in
      `src/lib/upstreams.ts` resolves only `SEEK_SERVER_TOKEN`, with a Vault
      source it builds on first use. In direct mode, `requireEnv()` in
      `src/lib/env.ts` resolves a provider key from the environment and then
      the configuration file, and raises `MissingEnvError` when neither has a
      value that is not blank.
  client-tokens:
    >-
      `SecretResolver.serverTokens()` splits the resolved `SEEK_SERVER_TOKEN`
      on commas and drops empty entries; the server accepts each entry. The
      client sends the whole resolved value as one bearer token.
  vault-configuration:
    >-
      `vaultConfigFromEnv()` returns null when `SEEK_VAULT_PATH` is not set.
      Otherwise it requires an address from `SEEK_VAULT_ADDR`, `VAULT_ADDR` or
      `BAO_ADDR` and one credential, in this order: an AppRole role ID with a
      secret ID read from `SEEK_VAULT_SECRET_ID_FILE` or
      `SEEK_VAULT_SECRET_ID`; a token file from `SEEK_VAULT_TOKEN_FILE`; or a
      token from `VAULT_TOKEN` or `BAO_TOKEN`. It reads the mount, the KV
      version, the refresh interval, the AppRole mount and the namespace from
      the variables the `configuration` specification defines, and raises an
      error that names the variable when a value is missing or invalid. Vault
      and OpenBao share one HTTP API, so one client serves both.
  vault-reads:
    >-
      `VaultSecretSource` reads one KV secret with `GET
      /v1/<mount>/data/<path>` for KV version 2 or `GET /v1/<mount>/<path>`
      for version 1, sending `X-Vault-Token` and, when set,
      `X-Vault-Namespace`. AppRole logs in with `POST /v1/auth/<mount>/login`.
      Each call times out after 15 seconds. The source keeps the secret's
      string fields as a map, the time it read them, and at most one read in
      flight, which concurrent callers share. `get()` reads again when the map
      is older than the refresh interval, and a refresh interval of zero reads
      on every call.
  configuration-file:
    >-
      `loadConfig()` in `src/lib/config.ts` reads the configuration file once
      per process and caches its string values. A missing file gives an empty
      map. A file that is not valid JSON, or not a JSON object, writes one
      warning to stderr and gives an empty map.
  transport-trust:
    >-
      The Vault client uses Bun's `fetch`, so a private certificate authority
      is trusted through `NODE_EXTRA_CA_CERTS`.
