  - assets/first-search.gif
  - assets/install.gif
  - assets/config.gif
  - assets/web-search.gif
  - assets/research-job.gif
  - assets/scrape.gif
  - assets/connect.gif
  - assets/server.gif
  - assets/agent-skill.gif
  - assets/server-client.gif
  - assets/script-research-jobs.gif
