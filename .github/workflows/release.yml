name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Build and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_GITHUB_RELEASE: "1"
        run: ./scripts/release.sh

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-macos-arm64
          path: dist/release/seek-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-macos-x86_64
          path: dist/release/seek-macos-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-linux-arm64
          path: dist/release/seek-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: seek-linux-x86_64
          path: dist/release/seek-linux-x86_64.tar.gz
          if-no-files-found: error

  publish-homebrew-tap:
    name: Publish Homebrew formula
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: wyrd-company/homebrew-tools
          path: homebrew-tools
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}

      - name: Generate, commit, and push formula
        env:
          ARTIFACT_ROOT: artifacts
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TAP_DIR: homebrew-tools
        run: ./scripts/publish-homebrew-tap.sh
